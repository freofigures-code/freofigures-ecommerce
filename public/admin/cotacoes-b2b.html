<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Cotações B2B — Admin FreoFigures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#07111a;color:#f5f5f5;font-family:'Space Grotesk',sans-serif}button,input,textarea,select{font:inherit}a{color:#e5bb62}header{background:#061524;border-bottom:1px solid #ffffff20;padding:22px max(20px,calc((100vw - 1200px)/2))}header a{text-decoration:none;font-weight:700}main{max-width:1200px;margin:auto;padding:38px 20px 90px}h1,h2{font-family:Outfit,sans-serif}h1{font-size:clamp(30px,5vw,45px);margin:0 0 8px}p{line-height:1.5}.muted{color:#aeb9c1}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:25px 0}.toolbar select,.toolbar button,.quote select,.quote textarea,.quote button{background:#0d2231;color:#fff;border:1px solid #ffffff35;padding:10px}.toolbar button,.quote button{cursor:pointer}.toolbar button:hover,.quote button:hover{border-color:#e5bb62}.quote{border:1px solid #ffffff22;background:#0b1b29;padding:22px;margin:14px 0}.quote-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}.quote h2{font-size:22px;margin:4px 0}.tag{display:inline-block;color:#e5bb62;font-size:12px;text-transform:uppercase;letter-spacing:.09em}.meta{font-size:13px;color:#aeb9c1}.quote-body{white-space:pre-wrap;overflow-wrap:anywhere}.quote-grid{display:grid;grid-template-columns:220px 1fr auto;align-items:end;gap:12px;margin-top:20px}.quote label{display:block;font-size:12px;color:#c7d2d9}.quote label>*{display:block;width:100%;margin-top:6px}.quote textarea{min-height:80px;resize:vertical}.quote button{background:#e5bb62;color:#061524;font-weight:700;border-color:#e5bb62}.error{color:#ff9a9a}.success{color:#9ee4b9}#list:empty:after{content:'Nenhuma cotação encontrada.';color:#aeb9c1}.chat{margin-top:20px;border:1px solid #e5bb6260;background:#07111a}.chat-head{padding:12px 16px;border-bottom:1px solid #ffffff22}.chat-messages{max-height:360px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.chat-message{background:#26333d;padding:12px;max-width:80%;overflow-wrap:anywhere}.chat-message.mine{background:#15394f;align-self:flex-end}.chat-message p{white-space:pre-wrap;margin:6px 0}.chat-message img{display:block;max-width:100%;max-height:240px;object-fit:contain}.chat-form{border-top:1px solid #ffffff22;padding:16px;display:grid;gap:10px}.chat-form textarea{width:100%;min-height:75px}.chat-form input{max-width:100%}.chat-form button{justify-self:start}.quote .chat-toggle{margin-top:16px}.chat-error{color:#ff9a9a}@media(max-width:760px){.quote-grid{grid-template-columns:1fr}.quote{padding:17px}.chat-message{max-width:95%}}
  </style>
</head>
<body>
<header><a href="/admin/produtos.html">← Administração FreoFigures</a></header>
<main>
  <p class="tag">Corporativo</p><h1>Cotações B2B</h1>
  <p class="muted">Acompanhe os projetos enviados pelas empresas e converse com cada cliente dentro do site. Cada protocolo tem mensagens e imagens privadas.</p>
  <p id="notice" role="status">Verificando acesso...</p>
  <div id="content" hidden>
    <div class="toolbar"><label>Filtrar andamento <select id="filter"><option value="all">Todas</option><option value="recebida">Recebidas</option><option value="em_analise">Em análise</option><option value="proposta_enviada">Proposta enviada</option><option value="aprovada">Aprovadas</option><option value="recusada">Não aprovadas</option></select></label><button id="refresh" type="button">Atualizar lista</button></div>
    <div id="list"></div>
  </div>
</main>
<script>
(function(){
  'use strict';
  var db = supabase.createClient('https://rrmxqpvxrpcqqxsgccqw.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJybXhxcHZ4cnBjcXF4c2djY3F3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1OTc5MjcsImV4cCI6MjA4ODE3MzkyN30.v4IoG2wln2-4T-DZ9CKdrftEu4oI6-bLfE8gRlWzDYM');
  var statuses = {recebida:'Recebida',em_analise:'Em análise',proposta_enviada:'Proposta enviada',aprovada:'Aprovada',recusada:'Não aprovada'};
  var categories = {loja:'Produtos em quantidade',eventos:'Personalizados para eventos',sob_medida:'Novo produto sob medida'};
  var rows = [];
  var currentUserId = null;
  var activeQuoteId = null;
  var signedCache = {};
  var notice = document.getElementById('notice');
  function el(tag, cls, value){var node=document.createElement(tag);if(cls)node.className=cls;if(value!==undefined)node.textContent=value;return node;}
  function show(message, error){notice.textContent=message;notice.className=error?'error':'success';}
  async function load(){
    show('Carregando cotações...',false);
    var result=await db.from('b2b_quote_requests').select('id,user_id,company_name,contact_email,contact_phone,category,product_name,description,quantity,deadline,status,admin_note,estimated_unit_price,estimated_total,customization,created_at,updated_at').order('created_at',{ascending:false});
    if(result.error){show('Erro ao carregar cotações. Confirme que o SQL B2B foi aplicado.',true);return;}
    rows=result.data||[];
    show(rows.length+' solicitação(ões) encontrada(s).',false);
    render();
  }
  function render(){
    var list=document.getElementById('list');list.replaceChildren();
    var filter=document.getElementById('filter').value;
    rows.filter(function(row){return filter==='all'||row.status===filter;}).forEach(function(row){
      var card=el('article','quote');
      var head=el('div','quote-head');
      var heading=el('div');heading.append(el('span','tag',categories[row.category]||row.category),el('h2','',row.company_name));
      heading.append(el('p','meta',(row.product_name?row.product_name+' · ':'')+'Protocolo '+row.id+' · '+new Date(row.created_at).toLocaleDateString('pt-BR')));
      heading.append(el('p','meta','Contato: '+(row.contact_email||'E-mail não informado')+(row.contact_phone?' · '+row.contact_phone:'')));
      head.append(heading,el('span','tag',statuses[row.status]||row.status));card.append(head);
      card.append(el('p','quote-body',row.description));
      if(row.customization){
        var choice=el('p','meta');
        choice.append(el('strong','', 'Personalização: '),el('span','',row.customization.color_name+' · Texto: '+row.customization.text));
        var color=el('span');color.style.display='inline-block';color.style.width='17px';color.style.height='17px';color.style.border='1px solid #ffffff66';color.style.borderRadius='50%';color.style.backgroundColor=/^#[0-9a-f]{6}$/i.test(row.customization.color_hex)?row.customization.color_hex:'#777';color.style.verticalAlign='middle';color.style.margin='0 6px';
        choice.prepend(color);card.append(choice);
        if(row.customization.model_path){
          var modelLink=el('a','tag','Abrir modelo 3D e baixar STL');
          modelLink.href='/b2b-modelo-admin.html?quote='+encodeURIComponent(row.id);
          modelLink.target='_blank';modelLink.rel='noopener';modelLink.style.display='inline-block';
          card.append(modelLink);
        }
      }
      card.append(el('p','meta','Quantidade: '+Number(row.quantity).toLocaleString('pt-BR')+(row.deadline?' · Prazo desejado: '+row.deadline:'')));
      if(row.estimated_total!==null)card.append(el('p','tag','Estimativa: R$ '+Number(row.estimated_unit_price).toFixed(2).replace('.',',')+'/un. · R$ '+Number(row.estimated_total).toFixed(2).replace('.',',')+' total'));
      var grid=el('div','quote-grid');
      var statusLabel=el('label','','Andamento');var select=el('select');
      Object.keys(statuses).forEach(function(key){var opt=el('option','',statuses[key]);opt.value=key;opt.selected=row.status===key;select.append(opt);});statusLabel.append(select);
      var noteLabel=el('label','','Resumo visível para o cliente');var textarea=el('textarea');textarea.maxLength=2000;textarea.value=row.admin_note||'';textarea.placeholder='Ex.: proposta em elaboração; veja os detalhes na conversa abaixo.';noteLabel.append(textarea);
      var save=el('button','','Salvar andamento');save.type='button';
      save.onclick=async function(){
        save.disabled=true;save.textContent='Salvando...';
        var update=await db.from('b2b_quote_requests').update({status:select.value,admin_note:textarea.value.trim()||null}).eq('id',row.id).select('id').single();
        if(update.error){show('Não foi possível salvar a cotação '+row.id.slice(0,8)+'. Tente novamente.',true);save.disabled=false;save.textContent='Salvar andamento';return;}
        await load();
      };
      grid.append(statusLabel,noteLabel,save);card.append(grid);
      var toggle=el('button','chat-toggle',activeQuoteId===row.id?'Fechar conversa':'Abrir conversa e imagens');toggle.type='button';
      toggle.onclick=function(){activeQuoteId=activeQuoteId===row.id?null:row.id;render();};card.append(toggle);
      if(activeQuoteId===row.id){card.append(buildChat(row));}
      list.append(card);
    });
    if(activeQuoteId)void loadMessages(activeQuoteId);
  }
  function buildChat(row){
    var panel=el('section','chat');
    panel.append(el('div','chat-head','Conversa privada · '+row.company_name+' · '+row.id.slice(0,8).toUpperCase()));
    var messages=el('div','chat-messages');messages.id='chat-messages-'+row.id;messages.append(el('p','muted','Carregando mensagens...'));panel.append(messages);
    var form=el('form','chat-form');
    var error=el('p','chat-error');error.setAttribute('role','alert');error.hidden=true;
    var body=el('textarea');body.maxLength=4000;body.placeholder='Escreva para esta empresa...';
    var file=el('input');file.type='file';file.accept='image/jpeg,image/png,image/webp';file.setAttribute('aria-label','Imagem da conversa');
    var send=el('button','','Enviar mensagem');send.type='submit';
    form.append(error,body,file,send);form.onsubmit=function(event){event.preventDefault();void sendMessage(row.id,body,file,send,error);};
    panel.append(form);return panel;
  }
  async function imageUrl(path){
    if(signedCache[path]&&signedCache[path].expires>Date.now())return signedCache[path].url;
    var result=await db.storage.from('b2b-quote-images').createSignedUrl(path,3600);
    if(result.error||!result.data?.signedUrl)return '';
    signedCache[path]={url:result.data.signedUrl,expires:Date.now()+50*60*1000};
    return result.data.signedUrl;
  }
  async function loadMessages(quoteId){
    var container=document.getElementById('chat-messages-'+quoteId);
    if(!container)return;
    var result=await db.from('b2b_quote_messages').select('id,sender_id,body,attachment_path,created_at')
      .eq('quote_id',quoteId).order('created_at').order('id');
    if(activeQuoteId!==quoteId||!container.isConnected)return;
    if(result.error){container.replaceChildren(el('p','chat-error','Não foi possível carregar esta conversa.'));return;}
    var nodes=await Promise.all((result.data||[]).map(async function(message){
      var item=el('div','chat-message'+(message.sender_id===currentUserId?' mine':''));
      item.append(el('small','tag',(message.sender_id===currentUserId?'Equipe FreoFigures':'Cliente')+' · '+new Date(message.created_at).toLocaleString('pt-BR')));
      if(message.body)item.append(el('p','',message.body));
      if(message.attachment_path){
        var url=await imageUrl(message.attachment_path);
        if(url){var link=el('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';var img=el('img');img.src=url;img.alt='Imagem enviada na cotação';link.append(img);item.append(link);}
        else item.append(el('p','muted','Imagem indisponível. Atualize a conversa.'));
      }
      return item;
    }));
    if(activeQuoteId!==quoteId||!container.isConnected)return;
    if(!nodes.length)nodes.push(el('p','muted','Nenhuma mensagem ainda. Envie uma mensagem ou imagem para começar.'));
    var wasNearBottom=container.scrollTop+container.clientHeight>=container.scrollHeight-70;
    container.replaceChildren.apply(container,nodes);
    if(wasNearBottom)container.scrollTop=container.scrollHeight;
  }
  async function sendMessage(quoteId,body,fileInput,button,error){
    var text=body.value.trim();var file=fileInput.files?.[0]||null;
    if(!text&&!file)return;
    if(text.length>4000){error.textContent='A mensagem pode ter até 4.000 caracteres.';error.hidden=false;return;}
    var extensions={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
    if(file&&(!extensions[file.type]||file.size>5*1024*1024)){error.textContent='Envie JPG, PNG ou WEBP com até 5 MB.';error.hidden=false;return;}
    button.disabled=true;button.textContent='Enviando...';error.hidden=true;
    var path=null;var saved=false;
    try{
      var auth=await db.auth.getUser();
      if(auth.error||auth.data.user?.id!==currentUserId)throw new Error('Sua sessão expirou. Entre novamente.');
      if(file){
        path=quoteId+'/'+currentUserId+'/'+crypto.randomUUID()+'.'+extensions[file.type];
        var upload=await db.storage.from('b2b-quote-images').upload(path,file,{contentType:file.type,upsert:false});
        if(upload.error)throw upload.error;
      }
      var insert=await db.from('b2b_quote_messages').insert({quote_id:quoteId,sender_id:currentUserId,body:text,attachment_path:path});
      if(insert.error)throw insert.error;
      saved=true;
      body.value='';fileInput.value='';await loadMessages(quoteId);
    }catch(cause){
      if(path&&!saved)await db.storage.from('b2b-quote-images').remove([path]);
      error.textContent=saved?'Mensagem enviada. Atualize a conversa para vê-la.':(cause?.message||'Não foi possível enviar a mensagem.');error.hidden=false;
    }finally{button.disabled=false;button.textContent='Enviar mensagem';}
  }
  window.setInterval(function(){if(activeQuoteId)void loadMessages(activeQuoteId);},8000);
  document.getElementById('filter').onchange=render;
  document.getElementById('refresh').onclick=load;
  (async function(){
    try{
      var auth=await db.auth.getUser();
      if(auth.error||!auth.data.user){show('Entre com uma conta administradora para acessar esta página.',true);return;}
      var p=await db.from('profiles').select('is_admin').eq('id',auth.data.user.id).single();
      if(p.error||p.data?.is_admin!==true){show('Acesso restrito à administração.',true);return;}
      currentUserId=auth.data.user.id;
      document.getElementById('content').hidden=false;
      await load();
    }catch(e){show('Não foi possível verificar o acesso. Atualize a página.',true);}
  })();
})();
</script>
</body>
</html>
